version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql_container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: payments_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: n3u3da!

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./PaymentProcessing/backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - springboot-network

  backend:
    build:
      context: ./PaymentProcessing/backend
      dockerfile: Dockerfile
    container_name: backend-container

    depends_on:
      - mysql

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payments_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: n3u3da!

    ports:
      - "8085:8085"

    networks:
      - springboot-network

  frontend:
    build:
      context: ./PaymentProcessing/frontend-react
      dockerfile: Dockerfile
    container_name: frontend-container

    depends_on:
      - backend

    ports:
      - "8080:8080"

    networks:
      - springboot-network

volumes:
  mysql-data:

networks:
  springboot-network:

