server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — let React Router / client-side routing handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container so the same origin can be used
    # inside the docker network (e.g. http://frontend:5173/api/... -> backend:8085/api/...)
    location /api/ {
        proxy_pass http://backend:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
